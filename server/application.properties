spring.jooq.sql-dialect=Postgres
spring.config.import=file:config.yaml

# Local development database (see docker-compose.yml). Tests replace this with a Testcontainers database.
spring.datasource.url=jdbc:postgresql://localhost:5432/sona
spring.datasource.username=postgres
spring.datasource.password=12345

# Migrations run on startup. Keep the placeholders in sync with the flyway block in build.gradle.kts.
spring.flyway.default-schema=sona
spring.flyway.placeholders.schema=sona
spring.flyway.placeholders.user=sona

# Sona reads the rest of a refused request's body before answering (HttpUtils.discardRequestBody). For the answers
# Spring writes itself, such as a path no endpoint has, Tomcat reads it after answering, and by default only 2MB of it
# before closing the connection, which browsers report as a failed request rather than the answer. So it reads all of it.
server.tomcat.max-swallow-size=-1

# The ingest worker looks for pending ingests once a second, and does nothing when there are none. Tests turn it off
# with "-" and run its passes themselves.
sona.ingest-worker.cron=* * * * * *

# MusicBrainz allows about one request a second per client.
resilience4j.ratelimiter.instances.musicbrainz.limit-for-period=1
resilience4j.ratelimiter.instances.musicbrainz.limit-refresh-period=1s
# It answers 503 when it's busy or a client goes faster than that, so those requests are tried again after 2s, 4s and 8s.
resilience4j.retry.instances.musicbrainz.max-attempts=4
resilience4j.retry.instances.musicbrainz.wait-duration=2s
resilience4j.retry.instances.musicbrainz.enable-exponential-backoff=true
resilience4j.retry.instances.musicbrainz.exponential-backoff-multiplier=2
resilience4j.retry.instances.musicbrainz.retry-exceptions=org.springframework.web.client.HttpServerErrorException$ServiceUnavailable
