spring.jooq.sql-dialect=Postgres
spring.config.import=file:config.yaml

# Local development database (see docker-compose.yml). Tests replace this with a Testcontainers database.
spring.datasource.url=jdbc:postgresql://localhost:5432/sona
spring.datasource.username=postgres
spring.datasource.password=12345

# Migrations run on startup. Keep the placeholders in sync with the flyway block in build.gradle.kts.
spring.flyway.default-schema=sona
spring.flyway.placeholders.schema=sona
spring.flyway.placeholders.user=sona

# MusicBrainz allows about one request a second per client.
resilience4j.ratelimiter.instances.musicbrainz.limit-for-period=1
resilience4j.ratelimiter.instances.musicbrainz.limit-refresh-period=1s
