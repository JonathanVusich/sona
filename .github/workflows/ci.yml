name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    # jOOQ generates its classes from a live, migrated database, as build.gradle.kts configures it. The tests start
    # their own Postgres with Testcontainers, using the runner's Docker.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "12345"
          POSTGRES_DB: sona
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      # The wrapper jar isn't committed, so Gradle is installed at the wrapper's version instead.
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.5.0
      - name: Generate jOOQ classes
        run: gradle :server:flywayMigrate :server:jooqCodegen
      - name: Build and test
        run: gradle build
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '*/build/reports/tests/'

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Type-checks, then bundles.
      - run: npm run build
